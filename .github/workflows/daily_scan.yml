name: Daily NSE 2000+ Stock Scanner

on:
  schedule:
    # 11:00 UTC = 16:30 IST (4:30 PM Indian Standard Time, Monday to Friday)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp numpy pandas yfinance

      - name: Run 2,000+ Stock Batch Scanner
        run: |
          python scan_engine.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner_results.json stocks_master.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-refresh 2000+ stock scan results [skip ci]" && git push)

      - name: Auto-Sync scanner_results.json to InfinityFree FTP
        if: ${{ env.FTP_SERVER != '' }}
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Uploading updated scanner_results.json to InfinityFree FTP..."
          curl -s --ftp-create-dirs -T scanner_results.json "ftp://${FTP_SERVER}/htdocs/scanner_results.json" --user "${FTP_USERNAME}:${FTP_PASSWORD}" || \
          curl -s --ssl-reqd --ftp-create-dirs -T scanner_results.json "ftp://${FTP_SERVER}/htdocs/scanner_results.json" --user "${FTP_USERNAME}:${FTP_PASSWORD}"
          echo "FTP sync completed successfully!"
